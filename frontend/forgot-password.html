<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0F9FF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#031122">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Forgot Password — RiverGuard AI</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <script>document.documentElement.dataset.theme = localStorage.getItem('riverguard_theme') || 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <!-- Top Brand Icon & Name -->
      <div class="auth-brand-badge">
        <img src="images/logo.svg" alt="RiverGuard AI Logo" class="auth-brand-logo-img">
      </div>
      <div class="auth-brand-title">RiverGuard AI</div>
      <div class="auth-brand-sub">Smart River Surveillance &amp; Flood Defense</div>

      <!-- Main Headline -->
      <h1 class="auth-title" style="margin-bottom: 8px;">Reset Password</h1>
      <p style="font-size: 13.5px; color: var(--text-3); margin-bottom: 24px; line-height: 1.5;">
        Enter your registered email or mobile number to set a new password for your account.
      </p>

      <div id="resetSuccessBanner" class="callout callout-safe mb-4 hidden" role="status">
        <i class="fas fa-check-circle"></i><span id="resetSuccessText">Password reset successfully! Redirecting to sign in…</span>
      </div>

      <div id="resetError" class="callout callout-danger mb-4 hidden" role="alert">
        <i class="fas fa-circle-exclamation"></i><span id="resetErrorText"></span>
      </div>

      <form id="forgotPasswordForm" class="auth-form" novalidate>
        <div class="field">
          <label class="label" for="resetIdentifier">Email or Mobile Number</label>
          <input type="text" id="resetIdentifier" class="input" placeholder="e.g. operator@riverguard.ai or +919876543210" autocomplete="username" required>
        </div>

        <div class="field">
          <label class="label" for="resetNewPassword">
            <span>New Password</span>
            <span style="font-size:11px; font-weight:500; color:var(--text-4);">Min. 6 chars</span>
          </label>
          <div class="input-group">
            <input type="password" id="resetNewPassword" class="input" placeholder="Enter new password" autocomplete="new-password" required>
            <button type="button" class="input-group-action" id="toggleResetPasswordBtn" aria-label="Show password">
              <i class="fas fa-eye" id="toggleResetPasswordIcon"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="resetConfirmPassword">Confirm New Password</label>
          <div class="input-group">
            <input type="password" id="resetConfirmPassword" class="input" placeholder="Re-enter new password" autocomplete="new-password" required>
            <button type="button" class="input-group-action" id="toggleResetConfirmBtn" aria-label="Show confirm password">
              <i class="fas fa-eye" id="toggleResetConfirmIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-primary" id="btnSubmitReset">
          <span>Reset Password</span> <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">
        Remember your password? <a href="login.html">Back to Sign In</a>
      </p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      function setupToggle(btnId, inputId, iconId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (btn && input && icon) {
          btn.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          });
        }
      }
      setupToggle('toggleResetPasswordBtn', 'resetNewPassword', 'toggleResetPasswordIcon');
      setupToggle('toggleResetConfirmBtn', 'resetConfirmPassword', 'toggleResetConfirmIcon');
    })();
  </script>
</body>
</html>
