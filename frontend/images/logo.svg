<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient: Vibrant Oceanic Sky Blue -->
    <linearGradient id="rgShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    
    <!-- Wave Gradient 1 -->
    <linearGradient id="rgWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Wave Gradient 2 (Bright Crest) -->
    <linearGradient id="rgWave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="rgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield & Water Droplet Emblem -->
  <path d="M50 6 C69 6, 88 15, 88 38 C88 64, 50 94, 50 94 C50 94, 12 64, 12 38 C12 15, 31 6, 50 6 Z" 
        fill="url(#rgShieldGrad)" />

  <!-- Inner Soft Inset Depth -->
  <path d="M50 12 C65 12, 82 19, 82 38 C82 61, 50 87, 50 87 C50 87, 18 61, 18 38 C18 19, 35 12, 50 12 Z" 
        fill="#071E3D" opacity="0.22" />

  <!-- Flowing River Wave Layer 1 -->
  <path d="M20 54 C30 46, 42 62, 54 54 C66 46, 76 56, 80 52 C81 57, 80 63, 76 69 C68 79, 50 87, 50 87 C50 87, 32 79, 24 69 C21 64, 20 59, 20 54 Z" 
        fill="url(#rgWave1)" opacity="0.95" />

  <!-- Flowing River Wave Layer 2 (Foreground White-Froth Ripple) -->
  <path d="M23 63 C33 57, 44 69, 56 63 C65 59, 73 65, 76 62 C74 68, 69 74, 64 78 C57 83, 50 85.5, 50 85.5 C50 85.5, 43 83, 36 78 C31 74, 26 68, 23 63 Z" 
        fill="url(#rgWave2)" />

  <!-- Calibrated Hydrometric Horizon Grid -->
  <line x1="28" y1="40" x2="72" y2="40" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />

  <!-- AI Radar Sweep Concentric Arcs -->
  <path d="M42 31 C47 28, 53 28, 58 31" stroke="#BAE6FD" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M35 24 C44 19, 56 19, 65 24" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Central AI Telemetry Beacon Node -->
  <circle cx="50" cy="40" r="5" fill="#FFFFFF" filter="url(#rgGlow)" />
  <circle cx="50" cy="40" r="2.5" fill="#0284C7" />
</svg>
