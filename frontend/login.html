<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0F9FF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#031122">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sign in — RiverGuard AI</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/logo-192.png">
  <link rel="manifest" href="manifest.json">
  <script>document.documentElement.dataset.theme = localStorage.getItem('riverguard_theme') || 'light';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <!-- Top Brand Icon & Name (Image 1) -->
      <div class="auth-brand-badge">
        <img src="images/logo.png" alt="RiverGuard AI Logo" class="auth-brand-logo-img">
      </div>
      <div class="auth-brand-title">RiverGuard AI</div>
      <div class="auth-brand-sub">Smart River Surveillance &amp; Flood Defense</div>

      <!-- Main Headline (Image 1) -->
      <h1 class="auth-title">Welcome Back</h1>

      <!-- Tab Switcher (Image 1) -->
      <div class="auth-tab-switcher">
        <a href="login.html" class="auth-tab-btn active">
          <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </a>
        <a href="register.html" class="auth-tab-btn">
          <i class="fas fa-user-plus"></i> Sign Up
        </a>
      </div>

      <div id="registerSuccessBanner" class="callout callout-safe mb-4 hidden" role="status">
        <i class="fas fa-check-circle"></i><span id="registerSuccessText">Account created successfully! Enter your credentials to sign in.</span>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label class="label" for="loginEmail">Email or Mobile Number</label>
          <input type="text" id="loginEmail" class="input" placeholder="Email or Mobile number" autocomplete="username" required>
        </div>

        <div class="field">
          <label class="label" for="loginPassword">
            <span>Password</span>
            <a href="forgot-password.html" class="forgot-password-link">Forgot Password?</a>
          </label>
          <div class="input-group">
            <input type="password" id="loginPassword" class="input" placeholder="Enter password" autocomplete="current-password" required>
            <button type="button" class="input-group-action" id="togglePasswordBtn" aria-label="Show password">
              <i class="fas fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="callout callout-danger mb-4 hidden" role="alert">
          <i class="fas fa-circle-exclamation"></i><span id="loginErrorText"></span>
        </div>

        <button type="submit" class="btn-auth-primary" id="loginSubmitBtn">
          <span>Sign In to Account</span> <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">Don't have an account yet? <a href="register.html">Create New Account</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const btn = document.getElementById('togglePasswordBtn');
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('togglePasswordIcon');
      if (btn && input && icon) {
        btn.addEventListener('click', () => {
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
          btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
      }
    })();
  </script>
</body>
</html>
